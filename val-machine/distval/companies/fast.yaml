  - 0.475
  - 0.482
  - 0.490
  - 0.490
  - 0.490

# Opex as % of sales (selling, general & admin excl. D&A)
opex_pct_sales:
  - 0.307
  - 0.305
  - 0.303
  - 0.303
  - 0.303

# Working capital days (FY2023 actuals)
