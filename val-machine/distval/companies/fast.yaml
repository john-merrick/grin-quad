dso: 63.0    # receivable days ~63 (receivables $1,210M / revenue $6,981M * 365)
dpo: 27.0    # payable days ~27 (payables $279M / COGS $3,713M * 365)

maintenance_capex_pct_sales: 0.026  # FY2023: $182M / $6,981M ≈ 2.6%
tax_rate: 0.243                     # FY2023 effective rate 24.3%

# Mid-cycle EBIT: $6,981M revenue * 19.0% mid-cycle EBIT margin
mid_cycle_ebit: 1300.0

# Quality scores — single-segment, minimal M&A noise, best disclosure
