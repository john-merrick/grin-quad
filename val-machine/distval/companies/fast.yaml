# Fastenal (FAST) — manually keyed from 10-K filings
# Source: FAST 10-K FY2023 filed 2024-02-06 (primary), with 10-year history for mid-cycle derivation.
# All dollar values in millions USD.
#
# Mid-cycle gross margin derivation (FY2014–2023, per 10-K history):
#   2014: 51.4%, 2015: 51.5%, 2016: 51.4%, 2017: 50.9%, 2018: 49.9%,
#   2019: 50.1%, 2020: 46.9%, 2021: 45.9%, 2022: 45.6%, 2023: 46.8%
#   Mean: 49.0% — Note: COVID/freight distortion 2020-2021; 2022-2023 normalisng.
#   Mid-cycle gross margin used: 49.5% (mean excl. 2020-2022 freight disruption).
#
# Mid-cycle opex/sales:
#   Selling/admin % of sales FY2014-2023 average: ~29.5% of sales
#   After inflation of wages post-2021, normalised to 30.5%.
#
# Mid-cycle EBIT = Revenue * (gross_margin - opex%) = 7,000 * (0.495 - 0.305) = 7,000 * 0.19 = 1,330
# Rounded to 1,300 as a conservative mid-cycle estimate given continued cost pressure.

ticker: FAST
forecast_years: 5

# Revenue forecast: ~4-5% organic CAGR (consistent with long-run average, excluding abnormal 2021-2022)
revenue:
  - 7350.0
  - 7720.0
  - 8110.0
  - 8520.0
  - 8950.0

# Gross margin: normalising back to mid-cycle ~49% from current 46.8%
