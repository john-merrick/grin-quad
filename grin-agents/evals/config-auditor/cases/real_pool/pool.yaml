# Pool Corporation (POOL) — derived from distval ingest + normalise
# Source: POOL 10-K FY2025 filed 2026-02-26 (primary), 10-year history 2016–2025 for mid-cycle derivation.
# All dollar values in millions USD.
#
# Business: World's largest wholesale distributor of swimming pool and related products.
# ~60-65% of revenue is non-discretionary maintenance/repair; rest is new construction and remodeling.
# Revenue peaked at $6,180M in FY2022 (pandemic pool-build boom), then declined to FY2025 trough of
# $5,289M. Recovery forecast assumes housing activity and new-pool starts rebound gradually from 2026.
#
# distval flags (FY2025): [!] inventory_outpacing_revenue  [!] capex_exceeds_da
#
# Mid-cycle gross margin derivation (FY2016–2025, per distval normalise):
#   2016: 28.8%, 2017: 28.9%, 2018: 29.0%, 2019: 28.9%, 2020: 28.7%,
#   2021: 30.5%, 2022: 31.3%, 2023: 30.0%, 2024: 29.7%, 2025: 29.7%
#   10-yr mean: 29.6% (pandemic years inflate slightly; structural pricing power is real).
#   Mid-cycle gross margin used: 29.6%.
#
# Mid-cycle opex/sales (gross margin – EBIT margin, 10-yr avg per distval normalise):
#   10-yr avg opex: 17.4%.  FY2025 elevated at 18.8% due to volume deleverage off trough.
#   Mid-cycle opex used: 17.4% (consistent with FY2018–2019 pre-pandemic and FY2024 levels).
#
# Mid-cycle EBIT = Revenue × (gross_margin – opex_pct) = 5,700 × (0.296 – 0.174) = 5,700 × 0.122 ≈ 695
# Rounded to 695 as conservatively estimated mid-cycle figure.

ticker: POOL
forecast_years: 5

# Revenue forecast: Recovery from FY2025 trough ($5,289M). New pool starts still depressed in 2025–26;
# rebound expected from 2027 as housing affordability normalises. ~4–5% CAGR implied.
revenue:
  - 5400.0
  - 5600.0
  - 5850.0
  - 6100.0
  - 6350.0

# Gross margin: stabilised near 29.7% post-trough; slight improvement as volume recovers.
gross_margin:
  - 0.297
  - 0.297
  - 0.298
  - 0.299
  - 0.299

# Opex as % of sales. FY2025 elevated at 18.8%; improving as fixed costs are leveraged on recovery.
opex_pct_sales:
  - 0.185
  - 0.180
  - 0.178
  - 0.176
  - 0.174

# Working capital days — computed as days-of-revenue (engine base is revenue, not COGS).
# 10-yr averages from distval normalise (2016–2025):
#   DIO: avg 83.9 d  (FY2025 spike to 100.4 d flagged; mid-cycle avg used)
#   DSO: avg  9.3 d  (old YAML had 29.6 d — corrected; POOL is predominantly cash/short-term sales)
#   DPO: avg 31.5 d  (FY2025 spike to 45.0 d; mid-cycle avg used)
dio: 140 # days inventory oustanding - implies 2.6 turns
dso: 27.6 # days sales outstanding
dpo: 31.5 # days payable outstanding

# FY2024–2025 capex running ~$57–60M / ~$5,300M rev ≈ 1.06–1.12%.  Old YAML figure (0.5%) was understated.
maintenance_capex_pct_sales: 0.010
tax_rate: 0.254                     # FY2023 effective rate 25.4%; no update from distval

# Mid-cycle EBIT: $5,700M mid-cycle revenue × 12.2% mid-cycle EBIT margin (29.6% GM – 17.4% opex)
mid_cycle_ebit: 695.0

# Quality scores — dominant scale in a consolidating distribution channel
duration_score: 8    # installed base of 5-6M US pools drives recurring maintenance demand
stability_score: 7   # 60-65% maintenance/repair is non-discretionary; new construction cyclical

# Bridge items (in millions) — no material non-operating assets to add
other_elements: {}

# Balance sheet (FY2025 from distval ingest, in millions)
# total_debt: 1199.5
# cash: 105.0
# net_debt: 1094.5
# shares_diluted: ~39.5  (FY2023 figure; verify against FY2025 10-K — POOL has been buying back shares)
# minority_interest: 0.0
# spot_price: ~$300 (verify at run time)
