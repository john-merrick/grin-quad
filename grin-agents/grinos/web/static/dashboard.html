<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="grin-token" content="__GRIN_TOKEN__">
<title>Grin OS</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc;
  --accent: #2f5bd3; --ok: #1f7a4d; --bad: #b3261e; --warn: #9a6700; --chip: #eef0f6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141413; --panel: #1d1d1b; --text: #ecebe6; --muted: #9b9a93; --line: #33332f;
          --accent: #7aa0ff; --ok: #5fc48e; --bad: #f08a80; --warn: #e3b341; --chip: #26272c; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px;
         border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 17px; margin: 0; font-weight: 650; }
header a { color: var(--accent); text-decoration: none; margin-left: auto; }
.badge { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.badge.ok { color: var(--ok); } .badge.bad { color: var(--bad); }
nav { display: flex; gap: 4px; padding: 8px 16px; overflow-x: auto; border-bottom: 1px solid var(--line); }
nav button { border: 0; background: none; color: var(--muted); padding: 7px 11px; border-radius: 8px;
             font: inherit; cursor: pointer; white-space: nowrap; }
nav button.on { background: var(--chip); color: var(--text); font-weight: 600; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.card h3 { margin: 0 0 6px; font-size: 15px; }
.muted { color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
button.act { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px;
             border-radius: 8px; font: inherit; cursor: pointer; }
button.act.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.act.danger { color: var(--bad); }
input[type=text], textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
                             border-radius: 8px; padding: 8px 10px; width: 100%; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--chip); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.status { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--chip); }
.s-pending { color: var(--warn); } .s-approved, .s-published { color: var(--ok); }
.s-rejected, .s-failed { color: var(--bad); }
.msg { margin: 8px 0; } .msg .who { font-weight: 600; font-size: 13px; }
.msg.me .who { color: var(--muted); }
#toast { position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 520px; margin: auto; background: var(--text);
         color: var(--bg); padding: 10px 14px; border-radius: 10px; display: none; z-index: 5; }
.empty { color: var(--muted); padding: 20px 0; text-align: center; }
dialog#review { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(980px, 96vw);
                max-height: 92vh; background: var(--bg); color: var(--text); }
dialog#review::backdrop { background: rgba(0, 0, 0, .45); }
.dlg-head { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line);
            background: var(--panel); position: sticky; top: 0; z-index: 1; }
.dlg-head h2 { margin: 0; font-size: 16px; flex: 1; }
.dlg-body { padding: 14px 16px; overflow-y: auto; max-height: calc(92vh - 56px); }
.excerpt { white-space: pre-wrap; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel);
           border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 320px; overflow-y: auto; }
.excerpt mark { background: #ffe066; color: #1d1d1b; padding: 1px 0; border-radius: 2px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--chip); }
.chip.ok { color: var(--ok); } .chip.bad { color: var(--bad); } .chip.warn { color: var(--warn); }
.cite { border-left: 3px solid var(--line); }
.cite.confirmed { border-left-color: var(--ok); } .cite.disputed { border-left-color: var(--bad); }
textarea { min-height: 60px; resize: vertical; }
select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
a.link { color: var(--accent); text-decoration: none; } a.link:hover { text-decoration: underline; }
.pipeline { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0 10px; }
.pipeline .chip { cursor: pointer; } .pipeline .chip.on { background: var(--accent); color: #fff; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.step { font-size: 12px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); }
.step.done { color: var(--ok); border-color: var(--ok); } .step.blocked { color: var(--warn); border-color: var(--warn); font-weight: 600; }
.step.invalid { color: var(--bad); border-color: var(--bad); } .step.todo { color: var(--muted); }
.flag { color: var(--warn); font-size: 13px; }
select.small, input.small { width: auto; }
.agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.agent-card { cursor: pointer; } .agent-card:hover { border-color: var(--accent); }
.kpis { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; }
.kpis b { display: block; font-size: 17px; }
.json { white-space: pre-wrap; font: 12px/1.45 ui-monospace, Menlo, monospace; background: var(--panel); border: 1px solid var(--line);
        border-radius: 8px; padding: 10px; max-height: 60vh; overflow: auto; }
svg.chart { width: 100%; height: 220px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.pass { color: var(--ok); } .fail { color: var(--bad); }
.heat { border-collapse: separate; border-spacing: 2px; font-size: 12px; }
.heat td { padding: 0; } .heat td.cell { width: 18px; height: 16px; border-radius: 3px; cursor: pointer; }
.heat td.name { padding-right: 8px; white-space: nowrap; cursor: pointer; }
.c-ok { background: #1f7a4d; } .c-bad { background: #b3261e; } .c-mid { background: #d29b1f; } .c-none { background: var(--chip); }
.banner { border-left: 4px solid var(--warn); } .banner.ok { border-left-color: var(--ok); }
textarea.code { font: 12px/1.45 ui-monospace, Menlo, monospace; min-height: 340px; }
</style>
</head>
<body>
<header>
  <h1>Grin OS</h1>
  <span id="audit" class="badge">checking ledger…</span>
  <a href="/room">Voice room →</a>
</header>
<nav id="tabs"></nav>
<main id="panel"></main>
<dialog id="review"></dialog>
<div id="toast"></div>
<script>
const TOKEN = document.querySelector('meta[name="grin-token"]').content;

async function api(path, body) {
  const opt = body === undefined ? {} : {
    method: 'POST', headers: {'Content-Type': 'application/json', 'X-Grin-Token': TOKEN}, body: JSON.stringify(body)};
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({error: r.statusText}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// Builds DOM from data without ever parsing it as HTML.
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined) n.append(k instanceof Node ? k : String(k));
  return n;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 4000);
}

function pct(v) { return v === null || v === undefined ? '—' : (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%'; }
function fmt(v) { return Array.isArray(v) ? '[' + v.join(', ') + ']' : String(v); }

function table(headers, rows, onclick) {
  return el('div', {class: 'tablewrap'}, el('table', {},
    el('thead', {}, el('tr', {}, headers.map(h => el('th', {}, h)))),
    el('tbody', {}, rows.map((r, i) => el('tr', onclick ? {class: 'click', onclick: () => onclick(i)} : {},
      r.map(c => el('td', {}, c)))))));
}

async function refreshAudit() {
  const b = document.getElementById('audit');
  try {
    const a = await api('/api/audit');
    b.textContent = a.ok ? `Ledger intact · ${a.n} entries` : `LEDGER BROKEN · ${a.problems.length} problem(s)`;
    b.className = 'badge ' + (a.ok ? 'ok' : 'bad');
    if (!a.ok) b.title = a.problems.join('\n');
  } catch (e) { b.textContent = 'ledger: ' + e.message; b.className = 'badge bad'; }
}

async function act(path, body, done) {
  try { await api(path, body); toast('Recorded in the ledger.'); refreshAudit(); done && done(); }
  catch (e) { toast('Refused: ' + e.message); }
}

// --- review pop-up: every cited claim, highlighted in its source, confirmed before approval ---------

const dlg = document.getElementById('review');

function modal(title, ...body) {
  dlg.replaceChildren(el('div', {class: 'dlg-head'}, el('h2', {}, title),
    el('button', {class: 'act', onclick: () => dlg.close()}, 'Close')), el('div', {class: 'dlg-body'}, ...body));
  if (!dlg.open) dlg.showModal();
}

function excerptView(text, start, end) {
  // Three text nodes and a <mark>: the source is untrusted, so it is never parsed as HTML.
  const mark = el('mark', {}, text.slice(start, end));
  const box = el('div', {class: 'excerpt'}, text.slice(0, start), mark, text.slice(end));
  requestAnimationFrame(() => { box.scrollTop = Math.max(0, mark.offsetTop - box.offsetTop - box.clientHeight / 3); });
  return box;
}

function claimCard(c, ctx, reload) {
  const k = c.claim, ex = c.excerpt, rv = c.review;
  const verdictCls = c.verdict === 'verified' ? 'ok' : c.verdict === 'rejected' ? 'bad' : 'warn';
  const box = el('div', {});
  const draw = (text, s, e) => box.replaceChildren(excerptView(text, s, e));
  if (ex.found) draw(ex.before + ex.match + ex.after, ex.before.length, ex.before.length + ex.match.length);
  else box.replaceChildren(el('div', {class: 'chip bad'}, 'Quote not found in the stored source'), el('div', {class: 'excerpt'}, ex.after));
  const nav = el('div', {class: 'row muted'});
  if (ex.found) {
    nav.append(`match ${ex.match_index + 1} of ${ex.n_matches} · chars ${ex.raw_start}–${ex.raw_end} of ${ex.total_len}`);
    if (ex.n_matches > 1) nav.append(el('button', {class: 'act', onclick: async () => {
      const d = await api(`/api/claim/${c.claim_id}?context=${encodeURIComponent(ctx || '')}&match=${(ex.match_index + 1) % ex.n_matches}`);
      const e2 = d.excerpt; c.excerpt = e2; draw(e2.before + e2.match + e2.after, e2.before.length, e2.before.length + e2.match.length);
    }}, 'Next match'));
    nav.append(el('button', {class: 'act', onclick: async () => {
      const from = Math.max(0, c.excerpt.raw_start - 4000), to = c.excerpt.raw_end + 4000;
      const r = await fetch(`/api/source/${c.source.blob}?start=${from}&end=${to}`);
      if (!r.ok) return toast('Source unavailable');
      draw(await r.text(), c.excerpt.raw_start - from, c.excerpt.raw_end - from);
    }}, 'More context'));
  }
  const src = c.source;
  const links = el('div', {class: 'row muted'}, `${src.kind || 'source'} · published ${src.published_at || '?'} · blob ${src.blob.slice(0, 12)}`,
    src.edgar_url ? el('a', {class: 'link', href: src.edgar_url, target: '_blank', rel: 'noopener noreferrer'}, 'Open filing on EDGAR ↗') : (src.uri || ''),
    src.fragment_url ? el('a', {class: 'link', href: src.fragment_url, target: '_blank', rel: 'noopener noreferrer'}, 'Jump to the text ↗') : null);
  const failed = c.rule_checks.filter(x => !x.ok);
  const card = el('div', {class: 'card cite ' + (rv ? rv.decision : '')},
    el('div', {class: 'row'}, el('span', {class: 'chip ' + verdictCls}, c.verdict || 'no verdict'),
      el('strong', {}, k.statement)),
    el('div', {class: 'muted mono'}, `${c.claim_id} · ${k.metric} · ${k.period} · value ${k.value ?? '—'} ${k.unit || ''}`
      + (k.adjusted ? ' · non-GAAP' : '') + (k.segment ? ` · segment ${k.segment}` : '')),
    links, box, nav,
    failed.length ? el('div', {class: 'muted'}, 'Rule warnings: ' + failed.map(x => `${x.id} (${x.severity})`).join(', ')) : null,
    c.decision && c.decision.nature ? el('div', {class: 'muted'}, `Decision model: ${c.decision.action} · ${c.decision.nature} · ${c.decision.materiality}`) : null);
  if (!ctx) return card;
  if (rv) {
    card.append(el('div', {class: 'row'}, el('span', {class: 'chip ' + (rv.decision === 'confirmed' ? 'ok' : 'bad')},
      `${rv.decision} by ${rv.by}`), rv.note ? el('span', {}, rv.note) : null));
  } else {
    const note = el('input', {type: 'text', placeholder: 'note (required to dispute)'});
    const rej = el('input', {type: 'checkbox', id: 'rej-' + c.claim_id});
    const send = decision => () => act('/api/review', {target_kind: 'claim', target_id: c.claim_id, context_id: ctx,
      decision, note: note.value, reject_claim: decision === 'disputed' && rej.checked}, reload);
    card.append(note, el('div', {class: 'row'},
      el('button', {class: 'act primary', onclick: send('confirmed')}, 'Confirm: the highlight supports the claim'),
      el('button', {class: 'act danger', onclick: send('disputed')}, 'Dispute'),
      rej, el('label', {for: 'rej-' + c.claim_id, class: 'muted'}, 'and reject this claim as evidence')));
  }
  return card;
}

function feedbackBox(targetKind, targetId, company, existing, reload) {
  const kind = el('select', {}, ...['perspective', 'correction', 'dispute', 'praise'].map(k => el('option', {value: k}, k)));
  const text = el('textarea', {placeholder: 'Your perspective: what you think, what the evidence misses, what would change your mind'});
  return el('div', {class: 'card'}, el('h3', {}, 'Your perspective and feedback'),
    el('div', {class: 'muted'}, 'Recorded in the ledger. Perspectives go to the analyst as context (never as evidence) and can become eval cases.'),
    ...existing.map(f => el('div', {class: 'msg'}, el('div', {class: 'who'}, `${f.kind} · ${f.by} · ${f.ts}`), el('div', {}, f.text))),
    text, el('div', {class: 'row'}, kind, el('button', {class: 'act primary', onclick: () =>
      act('/api/feedback', {target_kind: targetKind, target_id: targetId, kind: kind.value, text: text.value, company}, reload)}, 'Add')));
}

async function openReview(pid) {
  const d = await api('/api/proposal/' + pid);
  const reload = () => openReview(pid);
  const done = d.approval;
  const note = el('textarea', {placeholder: 'Decision note (required): why you approve or reject'});
  const nConfirmed = Object.values(d.review_state).filter(v => v === 'confirmed').length;
  const canApprove = !done && d.check_ok && d.all_confirmed;
  const approve = el('button', {class: 'act primary', onclick: () => act('/api/approve', {proposal_id: pid, note: note.value}, () => { reload(); show(current); })}, 'Approve');
  if (!canApprove) approve.setAttribute('disabled', '');
  modal(`${d.company} · ${d.field}: ${fmt(d.old_value)} → ${fmt(d.new_value)}`,
    el('div', {class: 'card'},
      el('div', {class: 'row'}, el('span', {class: 'chip'}, d.nature), el('span', {class: 'chip'}, 'EV ' + pct(d.impact.ev_change_pct)),
        el('span', {class: 'chip ' + (d.check_ok ? 'ok' : 'bad')}, d.check_ok ? 'checks pass' : 'checks failed'),
        el('span', {class: 'mono muted'}, `${pid} · ${d.run_id}`)),
      el('p', {}, d.rationale),
      d.problems.length ? el('div', {class: 'muted'}, 'Problems: ' + d.problems.join('; ')) : null),
    el('h3', {}, `Evidence (${nConfirmed} of ${d.cites.length} confirmed)`),
    ...d.cites.map(c => claimCard(c, pid, reload)),
    feedbackBox('proposal', pid, d.company, d.feedback, reload),
    el('div', {class: 'card'}, el('h3', {}, 'Decision'),
      done ? el('div', {}, `${done.decision}d via ${done.channel}: ${done.note}`,
        done.decision === 'approve' && !done.cites_reviewed ? el('div', {class: 'muted'},
          'Approved without cite review (before the review gate, or rejected-only). Reviewing the evidence now still records your view.') : null) : el('div', {},
        canApprove ? null : el('div', {class: 'muted'}, d.check_ok ? 'Approve unlocks when every cited claim is confirmed.' : 'Failed its checks: reject only.'),
        note, el('div', {class: 'row'}, approve,
          el('button', {class: 'act danger', onclick: () => act('/api/reject', {proposal_id: pid, note: note.value}, () => { reload(); show(current); })}, 'Reject')))));
}

async function openClaim(cid) {
  const c = await api('/api/claim/' + cid);
  modal(c.claim.statement, claimCard(c, null, null),
        el('div', {class: 'row'}, 'Turn this claim into an eval case for:', ...['verifier', 'decision-model', 'mid-cycle-analyst'].map(a =>
          el('button', {class: 'act', onclick: () => caseEditor(a, 'claim:' + cid)}, a))),
        feedbackBox('claim', cid, c.claim.company, c.feedback, () => openClaim(cid)));
}

const TABS = {
  async Pending(p) {
    const d = await api('/api/pending');
    p.append(el('h2', {}, 'Proposals awaiting you'));
    if (!d.proposals.length) p.append(el('div', {class: 'empty'}, 'No proposals pending.'));
    for (const x of d.proposals) {
      p.append(el('div', {class: 'card'},
        el('h3', {}, `${x.company} · ${x.field}: ${fmt(x.old_value)} → ${fmt(x.new_value)}`),
        el('div', {class: 'muted'}, `${x.proposal_id} · ${x.nature} · EV ${pct(x.ev_change_pct)} · ${x.cites.length} cited claim(s)`),
        el('p', {}, x.rationale),
        el('div', {class: 'row'},
          el('button', {class: 'act primary', onclick: () => openReview(x.proposal_id)}, 'Review evidence and decide'))));
    }
    p.append(el('h2', {}, 'Claims needing review'));
    if (!d.claims.length) p.append(el('div', {class: 'empty'}, 'No claims need review.'));
    for (const c of d.claims) {
      p.append(el('div', {class: 'card'},
        el('h3', {}, c.statement), el('div', {class: 'muted mono'}, c.claim_id + ' · ' + c.company),
        el('p', {}, '“' + c.quote + '”'), el('div', {class: 'muted'}, c.reasons.join(' · ')),
        (() => { const note = el('input', {type: 'text', placeholder: 'note (required)'});
          return el('div', {}, note, el('div', {class: 'row'},
            el('button', {class: 'act', onclick: () => openClaim(c.claim_id)}, 'See it in the source'),
            el('button', {class: 'act primary', onclick: () => act('/api/resolve', {claim_id: c.claim_id, verdict: 'verified', note: note.value}, () => show('Pending'))}, 'Verified'),
            el('button', {class: 'act danger', onclick: () => act('/api/resolve', {claim_id: c.claim_id, verdict: 'rejected', note: note.value}, () => show('Pending'))}, 'Rejected'))); })()));
    }
  },
  async Runs(p) {
    const runs = (await api('/api/runs')).reverse();
    if (!runs.length) return p.append(el('div', {class: 'empty'}, 'No runs yet. Try: grinos ingest …'));
    const detail = el('div', {});
    p.append(table(['when', 'run', 'source', 'claims', 'verified', 'rejected', 'review', 'discarded'],
      runs.map(r => [r.ts, el('span', {class: 'mono'}, r.run_id), r.source || '—', r.claims, r.verified,
                     r.rejected, r.needs_human, r.discarded]),
      async i => { detail.replaceChildren(el('h2', {}, runs[i].run_id), stepsTable(await api('/api/run/' + encodeURIComponent(runs[i].run_id)))); detail.scrollIntoView(); }));
    p.append(detail);
  },
  async Trail(p) {
    const inp = el('input', {type: 'text', placeholder: 'claim id, e.g. c_b25b2c7a4cd4'});
    const out = el('div', {});
    const go = async () => { try { out.replaceChildren(stepsTable(await api('/api/trail/' + inp.value.trim()))); }
                             catch (e) { out.replaceChildren(el('div', {class: 'empty'}, e.message)); } };
    inp.addEventListener('keydown', e => e.key === 'Enter' && go());
    p.append(el('div', {class: 'card'}, el('h3', {}, 'Claim trail: source bytes → decision → rules → verdict'),
             el('div', {class: 'row'}, inp, el('button', {class: 'act primary', onclick: go}, 'Show'))), out);
  },
  async Proposals(p) {
    const ps = (await api('/api/proposals')).reverse();
    if (!ps.length) return p.append(el('div', {class: 'empty'}, 'No proposals yet. Try /analyse TICKER in the desk.'));
    for (const x of ps) {
      const cls = 's-' + x.status.split(' ')[0];
      p.append(el('div', {class: 'card'},
        el('div', {class: 'row'}, el('span', {class: 'status ' + cls}, x.status),
           el('strong', {}, `${x.company} · ${x.field}: ${fmt(x.old_value)} → ${fmt(x.new_value)}`)),
        el('div', {class: 'muted'}, `${x.proposal_id} · ${x.ts} · EV ${pct(x.ev_change_pct)} · ${x.cites.length} cited claim(s)`),
        el('p', {}, x.rationale),
        el('div', {class: 'row'}, el('button', {class: 'act', onclick: () => openReview(x.proposal_id)}, 'Review evidence')),
        x.problems.length ? el('div', {class: 'muted'}, 'Problems: ' + x.problems.join('; ')) : null,
        x.status === 'approved' ? el('div', {class: 'row'}, el('button', {class: 'act primary', onclick: async () => {

const STAGES = ['Idea', 'Deep Dive', 'Watchlist', 'Owned', 'Rejected', 'Archived'];

async function coverageDetail(runId) {
  const v = await api('/api/coverage/' + encodeURIComponent(runId));
  const reload = async () => box.replaceWith(await coverageDetail(runId));
  const T = v.request.ticker, st = v.status || {};
  const decide = async (body) => {
    try { const r = await api('/api/coverage/decide', {run_id: runId, ...body}); toast(`${body.target}: run is ${r.status} at ${r.step}`); reload(); }
    catch (e) { toast('Refused: ' + e.message); } };
  const box = el('div', {class: 'card'}, el('h3', {}, `${T} · coverage as of ${v.request.as_of}`),
    el('div', {class: 'muted mono'}, runId + (v.request.supersedes ? ` · supersedes ${v.request.supersedes}` : '')));
  // stage pipeline (your call; recorded with a note)
  box.append(el('div', {class: 'pipeline'}, ...STAGES.map(sname => el('span', {class: 'chip' + (v.stage === sname ? ' on' : ''),
    onclick: () => stageForm(sname)}, sname))));
  const stageNote = el('div', {});
  const stageForm = sname => stageNote.replaceChildren(el('div', {class: 'row'}, `Move ${T} to ${sname}:`,
    (() => { const n = el('input', {type: 'text', placeholder: 'why (required)'});
      return el('span', {class: 'row'}, n, el('button', {class: 'act primary', onclick: () =>
        act('/api/coverage/stage', {ticker: T, stage: sname, note: n.value}, reload)}, 'Record')); })()));
  box.append(stageNote);
  // step checklist
  const order = v.steps_order, at = order.indexOf(st.step);
  box.append(el('div', {class: 'steps'}, ...order.map((name, i) => {
    const cls = st.status === 'complete' || i < at ? 'done' : i === at ? (st.status === 'invalid' ? 'invalid' : 'blocked') : 'todo';
    return el('span', {class: 'step ' + cls}, `${i + 1}. ${name}`); })));
  const cur = v.steps[st.step] || {};
  if (st.status === 'invalid') box.append(el('div', {class: 'card'}, el('h3', {}, 'Invalid: fix with a revision'),
    ...((cur.output || {}).problems || (cur.output || {}).errors || []).map(x => el('div', {class: 'flag'}, x))));
  for (const b of cur.blocking || []) box.append(itemCard(b, v, decide, T, reload));
  // valuation grid once it exists
  const val = (v.steps.valuation || {}).output;
  if (val && val.longgamma) {
    const lg = val.longgamma;
    box.append(el('div', {class: 'card'}, el('h3', {}, 'Valuation (distval mid-cycle engine → LongGamma drivers)'),
      table(['scenario', 'EBIT FY2', 'multiple', 'target / share', 'probability'], ['Bear', 'Base', 'Bull'].map(sname =>
        [sname, Number(lg['EBIT FY2 ' + sname]).toFixed(1), Number(lg['Target Multiple ' + sname]).toFixed(2) + 'x',
         Number(val.targets[sname]).toFixed(2), (lg['Prob ' + sname] * 100).toFixed(0) + '%'])),
      el('div', {class: 'muted'}, `PW target ${Number(val.pw_target).toFixed(2)} · EV ${Number(val.engine.enterprise_value).toFixed(1)}M · `
        + `net debt ${Number(val.net_debt).toFixed(1)}M · shares ${Number(val.shares).toFixed(3)}M (XBRL)`)));
  }
  // drivers with their provenance (also after they're decided)
  const drv = (v.steps.drivers || {}).output;
  if (drv && drv.drivers) box.append(el('div', {class: 'card'}, el('h3', {}, 'Drivers and their sources'),
    table(['driver', 'XBRL', 'config', 'chosen', 'flags', ''], Object.values(drv.drivers).map(d => {
      const ch = (drv.chosen || {})[d.driver];
      return [d.driver, d.value == null ? '—' : Number(d.value).toPrecision(4), d.config_value == null ? '—' : Number(d.config_value).toPrecision(4),
              ch ? `${Number(ch.value).toPrecision(4)} (${ch.from})` : 'not decided', el('span', {class: 'flag'}, d.flags.join('; ')),
              el('button', {class: 'act', onclick: () => openDriver(d, drv.years)}, 'Sources')]; }))));
  // risks and catalysts
  box.append(riskCard(T, v.risks, v.catalysts, reload));
  // decisions, with revision for drivers / scenarios / judgements
  if (v.decisions.length) box.append(el('div', {class: 'card'}, el('h3', {}, 'Your decisions'),
    table(['item', 'decision', 'value', 'note', 'by', ''], v.decisions.map(dd => [dd.target, dd.decision + (dd.revises != null ? ' (revision)' : ''),
      dd.value ?? dd.text ?? '', dd.note, dd.by,
      /^(d_|s_bear_|s_bull_|s_probs|k_direction|k_nature)/.test(dd.target) ? el('button', {class: 'act', onclick: () => reviseForm(dd, decide)}, 'Revise') : '']))));
  if (st.status === 'complete') box.append(el('div', {class: 'card'}, el('h3', {}, 'Capture in Notion'),
    el('div', {class: 'row'}, ...['sync', 'risks'].map(k => el('button', {class: 'act primary', onclick: async () => {
      try { const r = await api('/api/coverage/capture', {kind: k, run_id: runId}); modal('LongGamma ' + k, el('pre', {style: 'white-space: pre-wrap'}, r.message)); }
      catch (e) { toast(e.message); } }}, k === 'sync' ? 'Prepare model sync' : 'Prepare risks + catalysts')))));
  if (v.memo) box.append(el('pre', {style: 'white-space: pre-wrap; font-size: 12px'}, v.memo));
  return box;
}

function itemCard(b, v, decide, T, reload) {
  const note = el('input', {type: 'text', placeholder: b.kind === 'driver' || b.kind === 'scenario' ? 'note: your reasoning and the source for a value' : 'note'});
  const card = el('div', {class: 'card'}, el('div', {class: 'row'}, el('span', {class: 'status s-pending'}, b.kind), el('strong', {}, b.id)),
    el('p', {}, b.detail));
  const btn = (label, body, primary) => el('button', {class: 'act' + (primary ? ' primary' : ''), onclick: () => decide({target: b.id, note: note.value, ...body})}, label);
  if (b.kind === 'driver') {
    const d = (v.steps.drivers.output.drivers || {})[b.driver];
    const val = el('input', {type: 'text', class: 'small', placeholder: 'your value'});
    card.append(el('div', {class: 'row'}, el('button', {class: 'act', onclick: () => openDriver(d, v.steps.drivers.output.years)}, 'See the facts and claims')),
      note, el('div', {class: 'row'}, btn('Accept the XBRL value', {decision: 'accept'}, true), val,
        el('button', {class: 'act', onclick: () => decide({target: b.id, decision: 'value', value: val.value, note: note.value})}, 'Set value'),
        btn('Keep the config value', {decision: 'keep'})));
  } else if (b.kind === 'scenario') {
    const val = el('input', {type: 'text', class: 'small', placeholder: 'value'});
    card.append(note, el('div', {class: 'row'}, val, el('button', {class: 'act primary', onclick: () => decide({target: b.id, decision: 'value', value: val.value, note: note.value})}, 'Set'),
      b.id === 's_probs' ? btn('Accept 25 / 50 / 25', {decision: 'accept'}) : null));
  } else if (b.kind === 'judgement') {
    const opts = b.id === 'k_direction' ? ['Long', 'Short'] : ['Structural', 'Cyclical', 'Mixed'];
    const sel = el('select', {}, ...opts.map(o => el('option', {value: o}, o)));
    card.append(note, el('div', {class: 'row'}, sel, el('button', {class: 'act primary', onclick: () => decide({target: b.id, decision: 'value', text: sel.value, note: note.value})}, 'Set')));
  } else if (b.kind === 'claim' || b.kind === 'dispute') {
    card.append(el('div', {class: 'row'}, el('button', {class: 'act', onclick: () => openClaim(b.claim_id)}, 'See it in the source')),
      b.kind === 'dispute' ? el('div', {}, note, el('div', {class: 'row'}, btn('Reject the claim', {decision: 'reject'}, true), btn('Keep it (accept)', {decision: 'accept'}))) : el('div', {class: 'muted'}, 'Resolve it in Pending → Claims needing review.'));
  } else if (b.kind === 'risks') {
    card.append(el('div', {class: 'muted'}, 'Add them below.'));
  } else {
    const val = el('input', {type: 'text', class: 'small', placeholder: 'value ($M)'});
    card.append(note, el('div', {class: 'row'}, btn('Accept', {decision: 'accept'}, true), val,
      el('button', {class: 'act', onclick: () => decide({target: b.id, decision: 'value', value: val.value, note: note.value})}, 'Set value')));
  }
  return card;
}

const COLORS = ['#2f5bd3', '#1f7a4d', '#b3261e', '#9a6700', '#7a3fd3', '#0f7d8c', '#c2185b', '#5d4037'];

function trendChart(runs) {
  // Rate metrics (0–1) per eval run, oldest left; dashed lines where the agent's version or model changed.
  const pts = runs.filter(r => r.kind === 'eval' && r.system === 'agent').slice().reverse();
  const keys = [...new Set(pts.flatMap(r => Object.entries(r.metrics).filter(([, v]) => v >= 0 && v <= 1).map(([k]) => k)))].slice(0, 8);
  const W = 900, H = 220, L = 34, R = 10, T = 10, B = 24, NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'chart');
  const add = (tag, attrs, text) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text) n.textContent = text; svg.append(n); return n; };
  if (!pts.length) { add('text', {x: 20, y: 30, fill: 'currentColor'}, 'No eval runs yet.'); return el('div', {}, svg); }
  const x = i => L + (pts.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (pts.length - 1)), y = v => T + (1 - v) * (H - T - B);
  for (const g of [0, 0.5, 1]) { add('line', {x1: L, x2: W - R, y1: y(g), y2: y(g), stroke: '#8884', 'stroke-width': 1}); add('text', {x: 4, y: y(g) + 4, 'font-size': 10, fill: 'currentColor'}, g.toFixed(1)); }
  pts.forEach((r, i) => { if (i && r.model !== pts[i - 1].model) add('line', {x1: x(i) - 3, x2: x(i) - 3, y1: T, y2: H - B, stroke: '#9a6700', 'stroke-dasharray': '4 3'}); });
  keys.forEach((k, ki) => {
    const series = pts.map((r, i) => [i, r.metrics[k]]).filter(([, v]) => v !== undefined);
    add('polyline', {points: series.map(([i, v]) => `${x(i)},${y(v)}`).join(' '), fill: 'none', stroke: COLORS[ki % COLORS.length], 'stroke-width': 2});
    for (const [i, v] of series) { const c = add('circle', {cx: x(i), cy: y(v), r: 3.5, fill: COLORS[ki % COLORS.length]});
      const t = document.createElementNS(NS, 'title'); t.textContent = `${k} ${v.toFixed(3)} · ${pts[i].date} · ${pts[i].model} · ${pts[i].passed ? 'PASS' : 'FAIL'}`; c.append(t); }
  });
  pts.forEach((r, i) => add('text', {x: x(i), y: H - 6, 'font-size': 9, 'text-anchor': 'middle', fill: r.passed ? '#1f7a4d' : '#b3261e'}, r.date.slice(4, 8)));
  return el('div', {}, svg, el('div', {class: 'legend'}, ...keys.map((k, ki) => el('span', {}, el('i', {style: `background:${COLORS[ki % COLORS.length]}`}), k)),
    el('span', {class: 'muted'}, 'date colour = gate pass/fail · dashed line = model changed')));
}

function caseHeat(agent, m, canAdd, reload) {
  if (!m.runs.length) return [el('h3', {}, 'Cases over time'), el('div', {class: 'muted'}, 'No eval runs with per-case results yet. The weekly heartbeat (or Optimize) will fill this in.')];
  const cls = v => v == null ? 'c-none' : v >= 1 ? 'c-ok' : v <= 0 ? 'c-bad' : 'c-mid';
  const chip = st => ({'new failure': 'bad', 'always failing': 'bad', flaky: 'warn', fixed: 'ok', passing: 'ok', new: ''}[st] || '');
  const rows = m.cases.map(c => el('tr', {},
    el('td', {class: 'name', onclick: () => caseHistory(agent, c.id, canAdd, reload)}, c.id, c.added ? ' ✚' : '', c.holdout ? ' 🔒' : ''),
    el('td', {}, el('span', {class: 'chip ' + chip(c.status)}, c.status)),
    ...c.results.map((v, i) => { const td = el('td', {class: 'cell ' + cls(v), onclick: () => caseHistory(agent, c.id, canAdd, reload)});
      td.title = `${m.runs[i].date} · ${m.runs[i].model} · ${v == null ? 'not run' : (v * 100).toFixed(0) + '% pass'}`; return td; })));
  const counts = m.cases.reduce((a, c) => (a[c.status] = (a[c.status] || 0) + 1, a), {});
  return [el('h3', {}, 'Cases over time'),
    el('div', {class: 'muted'}, Object.entries(counts).map(([k, v]) => `${v} ${k}`).join(' · ') + ` · columns are the last ${m.runs.length} eval runs, oldest left · ✚ added by you · 🔒 held out from the optimiser`),
    el('div', {class: 'tablewrap'}, el('table', {class: 'heat'}, el('tbody', {}, rows))),
    m.added.length ? el('div', {class: 'muted'}, `${m.added.length} case(s) you added: ` + m.added.map(a => a.id).join(', ')) : null];
}

async function caseHistory(agent, caseId, canAdd, reload) {
  let h;
  try { h = await api(`/api/agent/${agent}/case/${encodeURIComponent(caseId)}`); } catch (e) { return toast(e.message); }
  const lastFail = h.history.find(r => r.passed.includes(false)), lastPass = h.history.find(r => r.passed.every(Boolean));
  const fileOf = (r, ok) => r && r.files[r.passed.findIndex(x => x === ok)] || (r && r.files[0]);
  const compare = el('div', {});
  if (lastFail && lastPass) compare.append(el('button', {class: 'act', onclick: async () => {
    const [a, b] = await Promise.all([api(`/api/agent/${agent}/run/${encodeURIComponent(lastFail.run_id)}/case/${fileOf(lastFail, false)}`),
                                      api(`/api/agent/${agent}/run/${encodeURIComponent(lastPass.run_id)}/case/${fileOf(lastPass, true)}`)]);
    compare.replaceChildren(el('div', {style: 'display:grid;grid-template-columns:1fr 1fr;gap:8px'},
      el('div', {}, el('strong', {class: 'fail'}, `last failure · ${lastFail.date} · ${lastFail.model}`), json(a.result || a.output || a)),
      el('div', {}, el('strong', {class: 'pass'}, `last pass · ${lastPass.date} · ${lastPass.model}`), json(b.result || b.output || b)))); }}, 'Compare the last failure with the last pass'));
  modal(`${agent} · ${caseId}`,
    h.added ? el('div', {class: 'muted'}, `Added by ${h.added.added_by} on ${h.added.ts} from ${h.added.source}` + (h.added.holdout ? ' · held out from the optimiser' : '')) : null,
    table(['run', 'model', 'result', 'detail'], h.history.map(r => [r.date, r.model,
      el('span', {class: r.passed.every(Boolean) ? 'pass' : 'fail'}, r.passed.map(x => x ? '✓' : '✗').join(' ')),
      el('span', {}, ...r.files.map(f => el('button', {class: 'act', onclick: () => openCase(agent, r.run_id, f)}, f.replace(caseId + '.', ''))))])),
    compare,
    canAdd && h.history[0].files[0] ? el('button', {class: 'act', onclick: () => caseEditor(agent, `case:${h.history[0].run_id}/${h.history[0].files[0]}`, reload)}, '＋ Add a variant of this case') : null);

async function optimizeFlow(agent, reload, planId) {
  modal(`Optimize ${agent}`, el('div', {class: 'empty'}, planId ? 'Loading the saved plan…' : 'Planning: listing model, skill and tool variants, and asking the prompt-optimiser for prompt edits and a skill pack (about $0.05). Nothing is evaluated yet.'));
  let plan;
  try { plan = planId ? await api(`/api/agent/${agent}/plan/${planId}`) : await api(`/api/agent/${agent}/optimize/plan`, {}); }
  catch (e) { return modal('Optimize ' + agent, el('div', {class: 'fail'}, e.message)); }
  const picks = new Map(plan.variants.map(v => [v.id, el('input', {type: 'checkbox'})]));
  plan.variants.forEach(v => picks.get(v.id).checked = v.lever !== 'model' || v.est_cost_usd <= plan.baseline_cost_usd * 1.2);
  const total = el('strong', {});
  const recalc = () => { total.textContent = '$' + (plan.baseline_cost_usd + plan.variants.filter(v => picks.get(v.id).checked).reduce((a, v) => a + v.est_cost_usd, 0)).toFixed(2); };
  picks.forEach(c => c.addEventListener('change', recalc)); recalc();
  modal(`Optimize ${agent}`,
    el('div', {class: 'card'}, el('div', {}, `Learning from ${plan.failures} failing case(s) and correction(s). Each chosen variant runs the full ${agent} eval; a fresh run of the current agent is the baseline ($${plan.baseline_cost_usd.toFixed(2)}).`),
      el('div', {class: 'muted'}, 'A winner must pass every gate and do at least as well on every case, then be better (fewer failures) or at least 15% cheaper. It goes live only when you approve it.')),
    table(['run', 'lever', 'variant', 'why', 'est. cost'], plan.variants.map(v => [picks.get(v.id), v.lever, v.edits ? el('details', {}, el('summary', {}, v.label),
      ...v.edits.map(e => el('div', {class: 'json'}, '− ' + e.find + '\n+ ' + e.replace))) : v.skill_draft ? el('details', {}, el('summary', {}, v.label), el('div', {class: 'json'}, v.skill_draft.content)) : v.label,
      v.rationale, '$' + v.est_cost_usd.toFixed(2)])),
    el('div', {class: 'row'}, 'Estimated total including the baseline:', total,
      el('button', {class: 'act primary', onclick: async () => {
        const ids = plan.variants.filter(v => picks.get(v.id).checked).map(v => v.id);
        try { const r = await api(`/api/agent/${agent}/optimize/run`, {plan_id: plan.plan_id, variant_ids: ids});
              toast(`Running ${r.variants} variant(s) on Temporal (≈$${r.estimated_cost_usd})`); progress(agent, plan.plan_id); }
        catch (e) { toast('Not started: ' + e.message); } }}, 'Run the chosen variants')));
}

    table(['variant', 'gates', 'failing cases', 'eval cost'], r.evaluated.map(e => [e.label, el('span', {class: e.passed ? 'pass' : 'fail'}, e.passed ? 'pass' : 'fail'),

    box.append(el('div', {class: 'card'}, el('div', {class: 'row'}, el('span', {class: 'status s-pending'}, b.kind),
        el('strong', {}, `${b.item || ''} ${b.period || ''}`)), el('p', {}, b.detail), note,
      el('div', {class: 'row'}, ...choices.map(d => el('button', {class: 'act' + (d === choices[0] ? ' primary' : ' danger'),
                                                                  onclick: decide(d)}, d)))));
  }
  const detail_reload = async () => box.replaceWith(await valuationDetail(runId));
  if (v.memo) box.append(el('pre', {style: 'white-space: pre-wrap; font-size: 12px'}, v.memo));
  return box;
}

function stepsTable(entries) {
  if (!entries.length) return el('div', {class: 'empty'}, 'Nothing found.');
  return table(['#', 'stage', 'actor', 'detail'],
    entries.map(e => [e.seq, e.stage, el('span', {class: 'mono'}, e.actor), e.detail]));
}

let current = 'Pending';
async function show(name) {
  current = name;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  const p = document.getElementById('panel');
  p.replaceChildren(el('div', {class: 'empty'}, 'Loading…'));
  const frag = el('div', {});
  try { await TABS[name](frag); p.replaceChildren(frag); }
  catch (e) { p.replaceChildren(el('div', {class: 'empty'}, 'Error: ' + e.message)); }
  try { localStorage.setItem('grin-tab', name); } catch (_) {}
}

const nav = document.getElementById('tabs');
for (const name of Object.keys(TABS)) nav.append(el('button', {'data-tab': name, onclick: () => show(name)}, name));
let start = 'Pending';
try { start = localStorage.getItem('grin-tab') || start; } catch (_) {}
show(TABS[start] ? start : 'Pending');
refreshAudit();
</script>
</body>
